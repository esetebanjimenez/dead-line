<!doctype html>
<html lang="en">
<head>
<link rel="icon" href="data:,">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Dead Line</title>
<style>
  html,body{margin:0;height:100%;background:#4a6847;overflow:hidden;font-family:system-ui,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
  #stage{position:absolute;inset:0}
  #hud{position:absolute;left:0;right:0;bottom:0;display:flex;gap:12px;justify-content:center;padding:10px;pointer-events:none}
  .deploy{pointer-events:auto;width:84px;height:84px;border-radius:50%;border:3px solid #fff;background:#3f5a22;color:#fff;font-weight:800;font-size:12px;position:relative;cursor:pointer;overflow:hidden;padding:0}
  .deploy .fill{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.55) calc((1 - var(--p,1))*360deg),transparent 0)}
  .deploy{background-size:cover;background-position:center}
  .deploy span{position:absolute;left:0;right:0;display:block;text-shadow:0 1px 3px #000}
  .deploy span:first-of-type{bottom:0;padding:2px 0 5px;font-size:10px;line-height:11px;background:#000b;z-index:2}
  .deploy .n{top:20px;font-size:22px}
  .deploy span[data-k]{top:4px;font-size:10px;opacity:.9}
  .deploy.empty{border-color:#8a8a8a;animation:none;filter:grayscale(.9) brightness(.7)}
  .deploy .n.cost{display:flex;align-items:center;justify-content:center;gap:2px;white-space:nowrap}
  .deploy.empty .n.cost::before{filter:brightness(1.7) contrast(1.1)}
  .deploy .n.lock{font-size:13px;top:26px}
  .deploy .n.cost::before{content:"";width:18px;height:18px;flex:none;background:var(--scrap-small) center/contain no-repeat}
  #scrapicon{width:39px;height:39px;vertical-align:middle;margin-right:4px}
  .deploy.shake{animation:shake .2s}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  #top{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:center;gap:14px;font-weight:800;text-shadow:0 2px 0 #0008;pointer-events:none}
  .bar{width:130px;height:14px;border:2px solid #fff;border-radius:8px;background:#2a3a1c;overflow:hidden}
  .bar i{display:block;height:100%;width:100%}
  #banner{position:absolute;top:22%;left:0;right:0;text-align:center;font-size:34px;font-weight:900;color:#fff;text-shadow:0 3px 0 #d8343a;background:linear-gradient(90deg,transparent,#d8343acc,transparent);padding:8px;display:none;pointer-events:none}
  #end{position:absolute;inset:0;background:#000a;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-size:40px;font-weight:900}
  #end button{font-size:22px;padding:10px 26px;border-radius:24px;border:3px solid #fff;background:#d8343a;color:#fff;font-weight:800}
  #perf{position:absolute;left:6px;top:6px;font:11px monospace;background:#0008;padding:3px 6px;border-radius:4px;display:none;pointer-events:none;white-space:pre}
  #rotate{position:fixed;inset:0;background:#1d2a14;display:none;align-items:center;justify-content:center;text-align:center;font-size:24px;font-weight:800;z-index:9}
  @media (max-width:780px){
    #hud{gap:4px;padding:6px}
    .deploy{width:66px;height:66px;border-width:2px;font-size:10px}
    .deploy span:first-of-type{font-size:8px;line-height:9px;padding:1px 0 4px}
    .deploy .n{top:16px;font-size:17px}
    .deploy span[data-k]{top:3px;font-size:8px!important}
    .deploy .n.lock{font-size:11px;top:21px}
    .deploy .n.cost::before{width:14px;height:14px}
  }
  @media (orientation:portrait) and (max-width:800px){#rotate{display:flex}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="top"><div>Wave <span id="wave">1</span></div><div style="background:rgba(20,24,28,.82);color:#fff;font-weight:700;font-size:1.7em;line-height:1.2;padding:2px 14px;border-radius:12px;border:1px solid #6b6f73"><img id="scrapicon" alt="Scrap"><span id="scrap">0</span></div><div>Wall <div class="bar"><i id="wallbar" style="background:#c9a96b"></i></div></div><div>Base <div class="bar"><i id="basebar" style="background:#4fa3c7"></i></div></div></div>
<div id="banner"></div>
<div id="hud"></div>
<div id="perf"></div>
<div id="end"><div id="endtext"></div><button id="restart">Play again</button></div>
<div id="rotate">Rotate your device to landscape</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
